server {
    server_name lacitadellenumerique.fr www.lacitadellenumerique.fr;
    root /var/www/syndicatducode.fr/frontend/build;
    index index.html;

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8001/api/sitemap-citadelle.xml;
        proxy_set_header Host $host;
    }
    location = /sitemap-citadelle.xml {
        proxy_pass http://127.0.0.1:8001/api/sitemap-citadelle.xml;
        proxy_set_header Host $host;
    }

    # Redirection racine vers /citadelle
    location = / {
        return 301 /citadelle;
    }

    # Dynamic Rendering : robots -> prerender, humains -> SPA (scope /citadelle*)
    location ^~ /citadelle/ {
        if ($lcn_is_bot) { rewrite ^ /__prerender$uri last; }
        try_files $uri $uri/ /index.html;
    }
    location = /citadelle {
        if ($lcn_is_bot) { rewrite ^ /__prerender/citadelle last; }
        try_files $uri /index.html;
    }
    location ^~ /__prerender/ {
        internal;
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @lcn_spa_fallback;
        rewrite ^/__prerender/(.*)$ /api/prerender/$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @lcn_spa_fallback {
        try_files /index.html =404;
    }

    # Centre d'aide : rendu serveur par le backend (/api/aide)
    location = /aide {
        proxy_pass http://127.0.0.1:8001/api/aide;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /aide/ {
        proxy_pass http://127.0.0.1:8001/api/aide/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API backend
    location /api {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSL managed by Certbot
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/lacitadellenumerique.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lacitadellenumerique.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.lacitadellenumerique.fr) { return 301 https://$host$request_uri; }
    if ($host = lacitadellenumerique.fr) { return 301 https://$host$request_uri; }
    server_name lacitadellenumerique.fr www.lacitadellenumerique.fr;
    listen 80;
    return 404;
}
