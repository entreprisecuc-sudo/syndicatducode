# IMPORTANT : Ce fichier est la config de référence pour syndicatducode.fr
# Il sert le Syndicat du Code ET redirige /citadelle vers lacitadellenumerique.fr
#
# RÈGLES CRITIQUES :
#   1. /citadelle/* doit TOUJOURS rediriger vers lacitadellenumerique.fr (séparation des marques)
#   2. /api/uploads/citadelle/documents/ doit retourner 403 (SEC-001 - documents KYC privés)
#   3. Les fichiers uploads normaux sont servis directement via alias (performances)

server {
    server_name syndicatducode.fr www.syndicatducode.fr;
    root /var/www/syndicatducode.fr/frontend/build;
    index index.html;

    # SEC-001 : Bloquer l'accès direct aux documents KYC Citadelle
    # CRITIQUE : ce bloc doit rester AVANT location /api/uploads/
    location ^~ /api/uploads/citadelle/documents/ {
        return 403;
    }

    # Redirection des routes Citadelle vers le bon domaine (séparation des marques)
    # CRITIQUE : ce bloc doit rester AVANT location /
    location ^~ /citadelle {
        return 301 https://www.lacitadellenumerique.fr$request_uri;
    }

    # Fichiers uploads (images annonces, avatars) servis directement par Nginx
    location /api/uploads/ {
        alias /var/www/syndicatducode.fr/backend/uploads/;
    }

    # API backend
    location /api {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSL managed by Certbot
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/syndicatducode.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syndicatducode.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.syndicatducode.fr) { return 301 https://$host$request_uri; }
    if ($host = syndicatducode.fr) { return 301 https://$host$request_uri; }
    server_name syndicatducode.fr www.syndicatducode.fr;
    listen 80;
    return 404;
}
